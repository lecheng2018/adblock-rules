name: 更新广告过滤规则

on:
  schedule:
    # 每天 06:00 UTC (14:00 CST) 更新一次
    - cron: '0 6 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 更新规则
        run: |
          chmod +x .github/scripts/update-rules.sh
          .github/scripts/update-rules.sh

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: 自动更新广告规则 $(date -u '+%Y-%m-%d')"
          git push
